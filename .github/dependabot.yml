version: 2

updates:
  # ---------------------------------------------------------------------------
  # npm — whole pnpm workspace (root, packages/netframe, apps/docs)
  #
  # One root entry covers every workspace package and keeps pnpm-lock.yaml in
  # sync. Separate per-directory entries produced duplicate, manifest-only PRs
  # without lockfile changes, which fail `pnpm install --frozen-lockfile`.
  # ---------------------------------------------------------------------------
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Chicago
    open-pull-requests-limit: 10
    # astro check rejects TypeScript 7. Keep workspace compilers on 6.x until
    # Astro has a supported replacement; ts-content-mapper is experimental.
    ignore:
      - dependency-name: typescript
        versions: [">=7.0.0"]
    labels:
      - dependencies
    groups:
      # Astro and its integrations must move together (MDX peers on Astro).
      astro:
        patterns:
          - "astro"
          - "@astrojs/*"
      dev-tooling:
        patterns:
          - "typescript"
          - "tsx"
          - "sass"
          - "postcss"
          - "autoprefixer"
          - "cssnano"
          - "@types/node"
        update-types:
          - minor
          - patch
      changesets:
        patterns:
          - "@changesets/*"

  # ---------------------------------------------------------------------------
  # GitHub Actions
  # ---------------------------------------------------------------------------
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Chicago
    labels:
      - dependencies
      - ci
