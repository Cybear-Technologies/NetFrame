name: Release

on:
  push:
    branches: [main]

# Queue releases instead of cancelling: an interrupted `changeset publish`
# can leave npm and git tags out of sync.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    # Enable only after npm ownership, trusted publisher and environment protection exist.
    if: vars.NPM_RELEASE_ENABLED == 'true'
    environment: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22

      # Version comes from the root package.json "packageManager" field.
      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.21.1

      - name: Install Playwright Chromium
        run: pnpm --filter @netframe/docs exec playwright install --with-deps chromium

      - name: Verify before versioning or publishing
        run: pnpm run check && pnpm audit --audit-level high
      - name: Create release PR or publish
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          publish-script: pnpm release
          pr-title: "chore: version packages"
          commit-message: "chore: version packages"
        env:
          NPM_CONFIG_PROVENANCE: "true"
