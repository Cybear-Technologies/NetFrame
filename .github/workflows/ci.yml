name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22

      # Version comes from the root package.json "packageManager" field.
      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Stylelint (library SCSS) + astro check (docs .astro/TS, browser tests).
      - name: Lint
        run: pnpm run lint

      - name: Type check
        run: pnpm run typecheck

      # Builds the library, then checks exports, font URLs, source maps,
      # tarball contents, Sass consumption, tokens and button contrast.
      - name: Test library
        run: pnpm --filter netframe run test

      - name: Build docs
        run: pnpm --filter @netframe/docs run build

      - name: Install Playwright Chromium
        run: pnpm --filter @netframe/docs exec playwright install --with-deps chromium

      # Every built route (no errors / failed / external requests), theme and
      # copy-button behaviour, and the documented component JS snippets.
      - name: Browser tests
        run: pnpm --filter @netframe/docs run test:browser

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: apps/docs/playwright-report
          retention-days: 7

      - name: Audit dependencies (high and critical)
        run: pnpm audit --audit-level high
