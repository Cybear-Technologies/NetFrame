name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # Version comes from the root package.json "packageManager" field.
      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Stylelint (library SCSS) + astro check (docs .astro/TS, browser tests).
      - name: Lint
        run: pnpm run lint

      - name: Type check
        run: pnpm run typecheck

      # Builds the library, then checks exports, font URLs, source maps,
      # tarball contents, Sass consumption, tokens and button contrast.
      - name: Test library
        run: pnpm --filter netframe run test

      - name: Build docs
        run: pnpm --filter @netframe/docs run build

      - name: Install Playwright Chromium
        run: pnpm --filter @netframe/docs exec playwright install --with-deps chromium webkit

      # Every built route (no errors / failed / external requests), theme and
      # copy-button behaviour, and the documented component JS snippets.
      - name: Browser tests
        run: pnpm --filter @netframe/docs run test:browser

      # Focused phone smoke suite: navigation drawer and touch behaviour in Pixel 7
      # (Chromium) and iPhone 14 (WebKit) emulation. Emulation is not a physical device.
      - name: Mobile smoke tests
        run: pnpm --filter @netframe/docs run test:mobile

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: apps/docs/playwright-report
          retention-days: 7

      - name: Audit dependencies (high and critical)
        run: pnpm audit --audit-level high
